<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotUM Admin — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --um-red: #C4122F; --um-red-dark: #8E0D22; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, Arial, sans-serif;
    background: linear-gradient(135deg, #C4122F 0%, #8E0D22 100%);
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: white; border-radius: 18px; padding: 36px 32px;
    max-width: 360px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .card h1 { font-size: 20px; margin: 0 0 4px; color: #1a1a1e; }
  .card p { font-size: 13px; color: #6b6b73; margin: 0 0 20px; }
  label { display:block; font-size: 12px; font-weight: 600; color: #6b6b73; margin-bottom: 6px; }
  input {
    width: 100%; border: 1px solid #e6e6ea; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none;
    margin-bottom: 14px;
  }
  input:focus { border-color: var(--um-red); }
  button {
    width: 100%; background: var(--um-red); color: white; border: none;
    border-radius: 10px; padding: 11px 0; font-weight: 700; font-size: 14px;
    font-family: inherit; cursor: pointer;
  }
  button:hover { background: var(--um-red-dark); }
  .error { color: var(--um-red); font-size: 12px; margin-bottom: 12px; }
  .back { display:block; text-align:center; margin-top: 16px; font-size: 12px; color: #6b6b73; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>SpotUM Admin</h1>
    <p>Sign in to manage rooms and bookings.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter admin password" autofocus />
      <button type="submit">Sign in</button>
    </form>
    <a class="back" href="/">← Back to SpotUM</a>
  </div>
</body>
</html>
